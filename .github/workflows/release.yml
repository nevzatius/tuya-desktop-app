name: Windows release

# Pushing a tag such as v0.3.0 builds the Windows app, the installer and the portable zip, and attaches them to the release.
# workflow_dispatch only builds and uploads the files as a workflow artifact (no release is created).
# The build job can only read the repository; the separate publish job (tags only) is the only one that can write.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

env:
  # build_exe.ps1 installs exactly this PyInstaller; tests/test_packaging.py keeps it in sync with the script default.
  PYINSTALLER_VERSION: "6.22.3"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Tag must match version.py
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          . ./installer/app_info.ps1
          $version = (Get-AppInfo).Version
          if ($env:TAG_NAME -ne "v$version") { throw "Tag '$env:TAG_NAME' does not match version.py (v$version). Fix one of them and tag again." }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build the app (PyInstaller)
        shell: pwsh
        run: ./build_exe.ps1
      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: ./installer/build_installer.ps1
      - name: Collect release files (Setup, portable zip, SHA256SUMS)
        shell: pwsh
        run: ./installer/package_release.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release
          path: release-assets/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-release
          path: release-assets
      - name: Attach to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release-assets/*
          body_path: .github/release_body.md
          generate_release_notes: true
