name: Windows release

# Pushing a tag such as v0.3.0 builds the Windows app, the installer and the portable zip, and attaches them to the release.
# workflow_dispatch only builds and uploads the files as a workflow artifact (no release is created).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build the app (PyInstaller)
        shell: pwsh
        run: ./build_exe.ps1
      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: ./installer/build_installer.ps1
      - name: Collect release files (Setup, portable zip, SHA256SUMS)
        shell: pwsh
        run: ./installer/package_release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-assets/*
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: .github/release_body.md
          generate_release_notes: true
